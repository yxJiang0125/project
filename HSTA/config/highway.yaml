GPUS: (0,)
WORKERS: 4
PRINT_FREQ: 50
SAVE_CHECKPOINT_FREQ: 10

DATASET:
  DATASET: highway
  ROOT: datasets
  TRAINSET: training/frames
  TESTSET: testing/frames
  NUM_FRAMES: 4
  FRAME_STEPS: 1
  LOWER_BOUND: 100

TRAIN:
  BATCH_SIZE_PER_GPU: 4
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 150
  OPTIMIZER: adam
  LR_TYPE: multistep
  LR: 0.0002
  LR_STEP: [80, 120]
  LR_FACTOR: 0.5

TEST:
  BATCH_SIZE_PER_GPU: 1
  ANOMALY_THRESHOLD: 40.0

MODEL:
  NAME: HSTA
  INIT_WEIGHTS: true
  IMAGE_SIZE:
    - 224
    - 224
  ENCODED_FRAMES: 4
  DECODED_FRAMES: 0
  EXTRA:
    FINAL_CONV_KERNEL: 1
